<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — MDEA Business Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="/netlify-auth.js"></script>

<style>
  :root {
    --black:#000; --white:#fff; --off-white:#f5f4f0; --mid-gray:#8a8680;
    --charcoal:#1a1917; --gold:#c9a96e; --gold-light:#e5c99a; --danger:#e05050;
    --font-heading:'Playfair Display',serif; --font-body:'Montserrat',sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--black); color:var(--white); font-family:var(--font-body);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card {
    width:100%; max-width:400px; background:var(--charcoal);
    border:1px solid rgba(255,255,255,0.08); border-radius:12px;
    padding:36px 30px; box-shadow:0 24px 80px rgba(0,0,0,0.4);
  }
  .eyebrow { font-size:0.62rem; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; }
  h1 { font-family:var(--font-heading); font-weight:700; font-size:1.6rem; margin-bottom:26px; }
  label { display:block; font-size:0.65rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--mid-gray); margin-bottom:6px; }
  input {
    width:100%; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.12);
    border-radius:6px; padding:12px 14px; color:var(--white); font-size:0.9rem; margin-bottom:18px;
  }
  input:focus { border-color:var(--gold); }
  button {
    width:100%; padding:13px; border:none; border-radius:6px; cursor:pointer;
    font-family:var(--font-body); font-size:0.75rem; font-weight:600; letter-spacing:0.08em;
    text-transform:uppercase; background:var(--gold); color:#000; transition:.25s;
  }
  button:hover { background:var(--gold-light); }
  button:disabled { opacity:.5; cursor:default; }
  .link-row { text-align:center; margin-top:16px; }
  .link-row a { font-size:0.72rem; color:var(--mid-gray); text-decoration:underline; cursor:pointer; }
  .msg { font-size:0.75rem; margin-bottom:16px; padding:10px 12px; border-radius:6px; display:none; }
  .msg.error { display:block; background:rgba(224,80,80,0.12); color:#ff9494; border:1px solid rgba(224,80,80,0.3); }
  .msg.success { display:block; background:rgba(46,153,112,0.12); color:#6fd6ac; border:1px solid rgba(46,153,112,0.3); }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">MDEA Business Card</div>
    <h1>Connexion</h1>
    <div class="msg" id="msg"></div>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username">
      <label>Mot de passe</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" id="submitBtn">Se connecter</button>
    </form>
    <div class="link-row" id="forgotRow"><a onclick="resetPassword()">Mot de passe oublié ?</a></div>

    <form id="setPasswordForm" style="display:none">
      <label>Choisissez votre mot de passe</label>
      <input type="password" id="newPassword" required autocomplete="new-password" minlength="8" placeholder="8 caractères minimum">
      <label>Confirmez le mot de passe</label>
      <input type="password" id="newPasswordConfirm" required autocomplete="new-password" minlength="8">
      <button type="submit" id="setPasswordBtn">Valider et me connecter</button>
    </form>
  </div>

<script>
function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
}

// ------------------------------------------------------------
// Lien d'invitation ("bienvenue") ou de réinitialisation
// ("mot de passe oublié") : l'URL contient alors #invite_token=...
// ou #recovery_token=... — on affiche le formulaire "définir un
// mot de passe" à la place du formulaire de connexion classique.
// ------------------------------------------------------------
const authToken = NetlifyAuth.readAuthTokenFromUrl();
if (authToken) {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('forgotRow').style.display = 'none';
  document.getElementById('setPasswordForm').style.display = 'block';
  document.querySelector('h1').textContent = authToken.type === 'recovery'
    ? 'Nouveau mot de passe'
    : 'Bienvenue — créez votre mot de passe';
} else {
  // Si déjà connecté (token valide en cache), on va directement à l'éditeur.
  NetlifyAuth.getUser().then(user => {
    if (user) window.location.href = '/';
  });
}

document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw1 = document.getElementById('newPassword').value;
  const pw2 = document.getElementById('newPasswordConfirm').value;
  if (pw1.length < 8) { showMsg('Le mot de passe doit faire au moins 8 caractères.', 'error'); return; }
  if (pw1 !== pw2) { showMsg('Les deux mots de passe ne correspondent pas.', 'error'); return; }
  const btn = document.getElementById('setPasswordBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  try {
    await NetlifyAuth.setPasswordFromToken(authToken.token, authToken.type, pw1);
    window.location.href = '/';
  } catch (err) {
    showMsg(err.message || 'Ce lien est invalide ou a expiré.', 'error');
    btn.disabled = false; btn.textContent = 'Valider et me connecter';
  }
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Connexion…';
  try {
    await NetlifyAuth.login(email, password);
    window.location.href = '/';
  } catch (err) {
    let text = "Email ou mot de passe incorrect.";
    if (err && err.message && /too many/i.test(err.message)) {
      text = "Trop de tentatives — réessayez plus tard.";
    }
    showMsg(text, 'error');
    btn.disabled = false; btn.textContent = 'Se connecter';
  }
});

async function resetPassword() {
  const email = document.getElementById('email').value.trim();
  if (!email) { showMsg("Entrez d'abord votre email ci-dessus.", 'error'); return; }
  try {
    await NetlifyAuth.recoverPassword(email);
    showMsg("Email de réinitialisation envoyé — vérifiez votre boîte de réception.", 'success');
  } catch (err) {
    showMsg("Impossible d'envoyer l'email de réinitialisation.", 'error');
  }
}
</script>
</body>
</html>
