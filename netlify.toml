[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirige proprement /login vers login.html (pratique pour les liens
# window.location.href = '/login' déjà utilisés dans le code existant)
[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200
